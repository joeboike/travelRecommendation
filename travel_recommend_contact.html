<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us</title>
  <link rel="stylesheet" href="./travel_recommendation.css">
  <style>
    /* Some basic styling for demonstration purposes */
    #contactForm {
      max-width: 400px;
      margin: 0 auto;
    }
    #contactForm input,
    #contactForm textarea {
      color: white;
      width: 100%;
      margin-bottom: 15px;
      padding: 8px;
      border-radius: 20px;
      background-color: rgba(0,0,0,0.25);   /* slightly opaque for read-ability */
    } 
    #contactForm button {
      padding: 10px 20px;
      background-color: blue;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 20px;
    }
    #contactForm button:hover {
      background-color: navy;
    }
  </style>
</head>

<body>
   <nav><h2>TravelBloom</h2>
<ul>
  <li><a href="./travel_recommendation.html" id="home">Home </a></li>
  <li><a href="./travel_recommend_about.html" id="About">About Us </a></li>
  <li><a href="./travel_recommend_contact.html" id="contact">Contact Us </a></li>
</ul>
</nav>

  <div id="details">
    <figure><img src="./social_media_icons_v.png"></figure>
    <h1>Contact Us</h1>
    <p>Feel free to contact us for further assistance in your travel adventures.</p>
  </div>

  <form id="contactForm">
    <div>
      <label for="name" class="label">Name</label> 
      <input type="text" id="name" name="name" required>
    </div>
    <div>
      <label for="email" class="label">Email</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div>
      <label for="message" class="label">Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>
    </div>
    <button width=100% type="submit" onclick="thankyou()">Submit</button>
  </form>
  <script>
    function thankyou(){
        alert('Thank you for contacting us!')
    }
  </script>
</body>
</html>
